name: Build & Publish MuslimTimeKeeper APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional Release Tag (defaults to v<versionName> from app/build.gradle)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Extract App Version Tag
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n 1)
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimTimeKeeper-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release for In-App Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: حارس وقت المسلم ${{ steps.ver.outputs.tag }}
          body: "إصدار تلقائي من حارس وقت المسلم (${{ steps.ver.outputs.tag }})"
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
