name: Build Dynamic Island APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'رقم الإصدار للنشر في Releases (مثال: v1.1.2)'
        required: true
        default: 'v1.1.2'
        type: string
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Dynamic Island APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          PROJ_DIR=$(dirname "$SETTINGS_FILE")
          gradle -p "$PROJ_DIR" assembleDebug --no-daemon
          APK_SRC=$(find "$PROJ_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          cp "$APK_SRC" "./Dynamic-Island.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-v1.1.2-APK
          path: Dynamic-Island.apk

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.1.2" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Dynamic Island ${{ steps.tag.outputs.name }}"
          files: Dynamic-Island.apk
